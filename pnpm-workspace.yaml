packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: true
# Endurecimiento de cadena de suministro (ver hallazgo SEC-17 de la auditoría / CWE-829):
# espera 7 días antes de resolver una versión recién publicada, y nunca permite que una
# actualización baje el nivel de confianza configurado.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
# Excepciones puntuales y verificadas: pnpm compara "provenance" contra TODO el historial de
# versiones del paquete, no contra la misma línea mayor (bug documentado en pnpm/pnpm#10202).
# Estas 3 entradas son versiones legítimas y antiguas, publicadas antes de que existiera
# provenance, marcadas solo porque una versión NO relacionada y posterior del mismo paquete sí
# la tiene. Verificado el 2026-09-02: el hash de integridad en pnpm-lock.yaml coincide byte a
# byte con el que expone hoy el registro (`npm view <paquete> dist.integrity`) — no hay
# sustitución de contenido. No confundir con la campaña activa "Shai-Hulud", que afecta a otros
# paquetes (keyv, cacheable, debug, chalk, axios, node-ipc), no a estos tres.
trustPolicyExclude:
  - 'chokidar@4.0.3'
  - 'semver@6.3.1'
  - 'undici-types@6.21.0'
blockExoticSubdeps: true

# Overrides de seguridad: fuerzan la versión parcheada de dependencias transitivas con
# advisories críticos/altos que sus paquetes padre todavía no actualizaron (DoD del SRS:
# sin vulnerabilidades críticas/altas sin excepción documentada). Verificado 2026-09-15 con
# `pnpm audit`. Todas las versiones fijadas tienen más de 7 días publicadas, así que no
# requieren excepción a minimumReleaseAge. Revisar y retirar cada entrada cuando el paquete
# padre publique una versión que ya resuelva la advisory por sí misma.
overrides:
  # RCE/DoS en la cadena de subida de archivos del backend (multer) y en el build de Next.
  multer: '>=2.3.0'
  postcss: '>=8.5.28'
  sharp: '>=0.35.4'
  # js-yaml mantiene dos líneas mayores vivas en el árbol; no se unifican porque la API de
  # la 3.x y la 4.x no son compatibles.
  js-yaml@3: '>=3.15.2'
  js-yaml@4: '>=4.3.2'
  fast-uri: '>=3.1.7'
  deepmerge-ts: '>=8.0.2'
  # qs es runtime: lo usa express para parsear query strings en todo /api y /public.
  qs: '>=6.16.0'
  # file-type solo entra por el toolchain de build (@nestjs/cli > @swc/cli); el consumidor
  # directo ya pide ^21.3.4, así que el override solo alinea a las copias rezagadas del árbol.
  file-type: '>=21.3.4'
